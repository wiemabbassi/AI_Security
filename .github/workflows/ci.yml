name: LLM Security Gateway CI/CD Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Job 1: Unit & Integration Tests ────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run Unit & Integration Test Suite
        run: python -m pytest tests/ -v --junitxml=reports/pytest-report.xml
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Execute Direct Pipeline Functional Verification
        run: python test_live_pipeline_direct.py
        env:
          REDIS_HOST: localhost

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest-report.xml

  # ── Job 2: Garak Red-Team Vulnerability Gate ────────────────────────────────
  garak-redteam:
    name: Garak Red-Team Security Gate
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'   # only on push, not every PR

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Garak + Gateway Dependencies
        run: |
          pip install garak requests
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Start Ollama (CPU mode for CI)
        run: |
          curl -fsSL https://ollama.ai/install.sh | sh
          ollama serve &
          sleep 10
          ollama pull llama3.2:latest
          ollama pull llama-guard3:8b
        continue-on-error: true   # non-fatal if Ollama pull fails in CI

      - name: Start Security Gateway
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 8
        env:
          REDIS_HOST: localhost

      - name: Run Garak Red-Team Scan (CI probe set)
        run: python run_garak_scan.py --ci --format json > reports/garak_ci_result.json
        continue-on-error: true   # don't fail CI on vuln detection — report & notify instead

      - name: Evaluate Garak Gate Result
        run: |
          python -c "
          import json, sys
          with open('reports/garak_ci_result.json') as f:
              r = json.load(f)
          vulns = r.get('vulnerabilities_found', 0)
          probes = len(r.get('probes_run', []))
          print(f'Probes run: {probes}')
          print(f'Vulnerabilities found: {vulns}')
          if vulns > 0:
              print(f'WARNING: {vulns} vulnerabilities detected by Garak — review garak_ci_result.json')
              # Gate: block merge if more than 5 new vulnerabilities
              sys.exit(1 if vulns > 5 else 0)
          else:
              print('All probes passed.')
          "

      - name: Upload Garak Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garak-report
          path: reports/

  # ── Job 3: Giskard Vulnerability Scan ───────────────────────────────────────
  giskard-scan:
    name: Giskard LLM Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Giskard
        run: pip install giskard requests

      - name: Run Giskard Scan
        run: python tests/test_giskard_scan.py
        continue-on-error: true

      - name: Upload Giskard Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giskard-report
          path: reports/giskard_*.json
