name: LLM Security Gateway CI/CD Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Job 1: Unit & Integration Tests ────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run Unit & Integration Test Suite
        run: python -m pytest tests/ -v --junitxml=reports/pytest-report.xml
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Execute Direct Pipeline Functional Verification
        run: python test_live_pipeline_direct.py
        env:
          REDIS_HOST: localhost

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest-report.xml

  # ── Job 2: Garak Red-Team Vulnerability Gate ────────────────────────────────
  garak-redteam:
    name: Garak Red-Team Security Gate
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'   # only on push, not every PR

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Garak + Gateway Dependencies
        run: |
          pip install garak requests
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Start Ollama (CPU mode for CI)
        run: |
          curl -fsSL https://ollama.ai/install.sh | sh
          ollama serve &
          sleep 10
          ollama pull llama3.2:1b
        continue-on-error: true   # non-fatal if Ollama pull fails in CI


      - name: Start Security Gateway
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 8
        env:
          REDIS_HOST: localhost
          OLLAMA_MODEL: llama3.2:1b


      - name: Run Garak Red-Team Scan (CI probe set)
        run: |
          mkdir -p reports
          python run_garak_scan.py --ci --format json > reports/garak_ci_result.json || true
        continue-on-error: true   # don't fail CI step on scan errors

      - name: Evaluate Garak Gate Result
        run: |
          python -c "
          import json, sys, os
          path = 'reports/garak_ci_result.json'
          if not os.path.exists(path) or os.path.getsize(path) == 0:
              print('Garak scan report not generated (e.g. target/model unavailable in CPU CI). Skipping gate.')
              sys.exit(0)
          try:
              with open(path) as f:
                  r = json.load(f)
              vulns = r.get('vulnerabilities_found', 0)
              probes = len(r.get('probes_run', []))
              print(f'Probes run: {probes}')
              print(f'Vulnerabilities found: {vulns}')
              if vulns > 5:
                  print(f'WARNING: {vulns} vulnerabilities detected by Garak')
                  sys.exit(1)
              else:
                  print('Garak security gate passed.')
          except Exception as e:
              print(f'Error reading garak report: {e}')
              sys.exit(0)
          "


      - name: Upload Garak Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garak-report
          path: reports/

  # ── Job 3: Giskard Behaviour Checks (fast, runs on every PR) ─────────────────
  giskard-checks:
    name: Giskard Regression Checks (Fast CI Gate)
    runs-on: ubuntu-latest
    needs: test
    # Runs on every push and PR — these are the fast declarative checks

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pandas
          python -m spacy download en_core_web_sm

      - name: Start Security Gateway
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 8
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run Giskard Checks (Hard-Fail CI Gate)
        # This step is NOT continue-on-error — any regression blocks the PR
        run: |
          python -m pytest tests/test_giskard_scan.py::TestGiskardChecks -v \
            --junitxml=reports/giskard-checks-report.xml
        env:
          REDIS_HOST: localhost
          GATEWAY_URL: http://localhost:8000

      - name: Upload Giskard Checks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giskard-checks-report
          path: reports/giskard-checks-report.xml

  # ── Job 4: Giskard Full Vulnerability Scan (push only) ────────────────────
  giskard-scan:
    name: Giskard LLM Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Giskard
        run: pip install giskard requests pandas

      - name: Run Giskard Full Scan
        run: python tests/test_giskard_scan.py
        continue-on-error: true  # full scan can be flaky; checks above are the gate

      - name: Upload Giskard Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giskard-report
          path: reports/giskard_*.json
